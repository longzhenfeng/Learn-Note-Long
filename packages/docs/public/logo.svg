<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42b883;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#35495e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Open book in center -->
  <g transform="translate(100, 100)">
    <!-- Left page -->
    <path d="M -40 -30 Q -40 -25 -40 0 L -40 30 Q -40 35 -35 35 L -5 35 Q 0 35 0 30 L 0 -30 Q 0 -35 -5 -35 L -35 -35 Q -40 -35 -40 -30 Z" 
          fill="white" opacity="0.95"/>
    <!-- Right page -->
    <path d="M 40 -30 Q 40 -25 40 0 L 40 30 Q 40 35 35 35 L 5 35 Q 0 35 0 30 L 0 -30 Q 0 -35 5 -35 L 35 -35 Q 40 -35 40 -30 Z" 
          fill="white" opacity="0.95"/>
    
    <!-- Text lines on left page -->
    <line x1="-32" y1="-20" x2="-8" y2="-20" stroke="#42b883" stroke-width="2" opacity="0.7"/>
    <line x1="-32" y1="-10" x2="-8" y2="-10" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    <line x1="-32" y1="0" x2="-8" y2="0" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    <line x1="-32" y1="10" x2="-8" y2="10" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Text lines on right page -->
    <line x1="8" y1="-20" x2="32" y2="-20" stroke="#42b883" stroke-width="2" opacity="0.7"/>
    <line x1="8" y1="-10" x2="32" y2="-10" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="0" x2="32" y2="0" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="10" x2="32" y2="10" stroke="#35495e" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Center binding -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#35495e" stroke-width="2"/>
  </g>
  
  <!-- Decorative sparkles -->
  <circle cx="40" cy="40" r="3" fill="#FFD700" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="50" r="2.5" fill="#FFD700" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="150" r="2" fill="#FFD700" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
